<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevDeck - Runtime Loader</title><style>body{margin:0;background:#050507;color:#eee;font-family:system-ui;display:flex;height:100vh}#side{width:260px;background:#0f0f10;border-right:1px solid #222;padding:12px}#main{flex:1;display:flex;flex-direction:column;overflow:auto}.card{background:#141414;border:1px solid #222;border-radius:12px;padding:12px;margin:6px}.btn{padding:8px 12px;background:#3b82f6;border:none;color:#fff;border-radius:6px;cursor:pointer}#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body>
<div id="side"><b>Runtime AI Loader</b><br><small style="color:#666">No fixed location - Auto plugins</small><div id="status" style="margin-top:12px;font-size:11px;color:#0f0">● Loader Active</div><button onclick="upgradeAll()" class="btn" style="width:100%;margin-top:12px;background:#222;border:1px solid #333">Upgrade All Layers</button></div>
<div id="main"><div style="padding:12px"><h2>DevDeck - All Layers Active</h2><div id="pluginGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div><div class="card"><b>AI Plugin Builder</b><br><input id="pName" placeholder="New layer name e.g. voice, terminal" style="width:70%;padding:8px;background:#000;border:1px solid #333;color:#fff;border-radius:6px"><button onclick="createNew()" class="btn">Create Layer</button><pre id="pOut" style="background:#000;padding:8px;border-radius:6px;min-height:100px;margin-top:8px"></pre></div></div></div>
<script type="module">
import {loadPlugins} from '/runtime-loader.js';
loadPlugins();
window.upgradeAll = () => { localStorage.clear(); location.reload(); };
window.createNew = async () => {
  let name=document.getElementById('pName').value.trim(); if(!name)return;
  let out=document.getElementById('pOut'); out.textContent='AI creating '+name+' layer...';
  let r=await fetch('/api/plugin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pluginName:name})});
  let d=await r.json(); out.textContent=d.result||d.error;
  // auto save to localStorage as backup
  localStorage.setItem('plugin_'+name, d.result);
};
</script></body></html>
